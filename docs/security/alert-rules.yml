# Prometheus alerting rules for the Voice Agent API (apps/api GET /metrics).
# Metrics come from apps/api/src/runtime/metrics.ts. Counters are per process and reset on restart; increase() copes
# with resets. Rationale, per-rule blind spots and delivery: docs/security/monitoring.md and monitoring-deployment.md.
#
# Conventions
#  - Every rule declares `for:` explicitly. Remember that increase(x[W]) > 0 stays true for W after the last event, so
#    a `for:` shorter than W does NOT filter a single blip; it only matters for conditions that must persist.
#  - Aggregation is `sum by (instance)` because every API instance is its own counter set.
#  - The scrape job is assumed to be named `voice-agent-api` (see monitoring-deployment.md); change it in
#    MetricsTargetDown / ApiRestartLoop and in alert-rules.test.yml if yours differs.
#  - Known label values are exported at 0 from process start so the FIRST increment is visible to increase().
#
# RULES VALIDATED, DELIVERY UNVERIFIED. This repository configures no Prometheus, Alertmanager, pager or log
# aggregator, so nothing here proves an alert reaches a human. The rules themselves are validated by
# apps/api/src/runtime/alert-rules.test.ts (structure, metric names, threshold logic on fixtures) and by
# `promtool check rules alert-rules.yml` + `promtool test rules alert-rules.test.yml`, both of which PASSED on
# 2026-10-21 (19 rules; 24 test cases). Commands, versions and output: monitoring-deployment.md section 4.
groups:
  - name: voice-agent-security
    rules:
      # Any fail-open event means per-IP protection was OFF for real requests. No 'for': one event is already a
      # signal, and the 5m window keeps it active for 5 minutes after the last event.
      - alert: RateLimitStoreFailOpen
        expr: sum by (instance) (increase(rate_limit_fail_open_total[5m])) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Rate limiting failed open (requests served without limits)"
          action: "Check PostgreSQL health and the rate_limit_buckets table/grants; consider RATE_LIMIT_FAIL_MODE=closed during an attack."

      # Events present across a full 10m window for 10m: the store has been failing for >= 10 minutes, not a blip.
      - alert: RateLimitStoreFailOpenSustained
        expr: sum by (instance) (increase(rate_limit_fail_open_total[10m])) > 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Rate limiting has been failing open continuously for 10 minutes"
          action: "Database or rate_limit_buckets is down for a sustained period: per-IP protection is off. Restore the store or set RATE_LIMIT_FAIL_MODE=closed."

      # Fail-closed routes (login/MFA) return 503 on a store error: user visible. Both modes are counted.
      - alert: RateLimitStoreErrors
        expr: sum by (instance) (increase(rate_limit_backend_errors_total[5m])) > 5
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Rate-limit counter store is erroring (logins may be returning 503)"
          action: "Database unreachable or rate_limit_buckets broken. Check /ready and database logs."

      # Baseline stream denials are a handful (misdialled peers). 20 in 10 minutes means probing, a key rotation
      # problem or a misconfigured Exotel flow.
      - alert: StreamAuthDenialSpike
        expr: sum by (instance) (increase(stream_auth_denied_total[10m])) > 20
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Many media stream authentication denials"
          action: "Group by reason: token_* means token key/expiry problems, grant_* grant problems, unauthorized/token_required missing credentials."

      # Legitimate tokens are minted by this system; signature/claim failures are a key-set mismatch between
      # instances or forgery. Expired/missing are excluded (they happen naturally).
      - alert: StreamTokenIntegrityDenials
        expr: sum by (instance) (increase(stream_auth_denied_total{reason=~"token_(bad_signature|unknown_key|wrong_issuer|wrong_audience|wrong_type|bad_claims|malformed)"}[10m])) > 3
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Stream tokens failing signature or claim validation"
          action: "Key rotation not propagated to all instances, a wrong stream key set, or forged tokens. Compare key sets across instances and read access.stream_denied events."

      # Reuse is refused by design; more than 3 in 10m is beyond a single provider reconnect.
      - alert: StreamReplayDenials
        expr: sum by (instance) (increase(stream_auth_denied_total{reason=~"token_reused|grant_reused"}[10m])) > 3
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Stream token or grant replays refused"
          action: "A one-time grant/token was presented again: provider retry storm or replay attempt. Review access.stream_denied events by call."

      # Conflicts should be rare (stalled instance, duplicate routing). Summed ACROSS instances per kind, because a
      # conflict is seen by one instance while its cause may be another.
      - alert: StreamClaimConflicts
        expr: sum by (kind) (increase(stream_claim_conflicts_total[15m])) > 3
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Media stream claim conflicts"
          action: "Check load-balancer routing of the stream WebSocket and instance pauses (GC / CPU starvation). kind=lost means another instance took the claim."

      # The runtime role hit a privilege or RLS boundary: new code missing tenant scope, or role grant drift. Never
      # expected in steady state, so any occurrence pages. Only errors reaching the central error handler are counted.
      - alert: DbAuthorizationErrors
        expr: sum by (instance) (increase(db_authorization_errors_total[5m])) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Database permission / row-level-security errors"
          action: "Find the failing route in error logs (message contains permission denied / row-level security). Do not grant BYPASSRLS."

      # Non-zero means tenant isolation is not enforced by the database in this process (non-production boots
      # continue with a warning; production refuses to start and then shows as MetricsTargetDown).
      - alert: DbRuntimeRoleUnsafe
        expr: db_runtime_role_problems > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Runtime database role failed the startup safety check"
          action: "Connect as the restricted runtime role (docs/security/rls-rollout.md)."

      # Bare counter value, not increase(): it is incremented once during startup, before the first scrape, so
      # there is no earlier sample for increase() to diff against. Clears on the next restart.
      - alert: DbRoleCheckFailed
        expr: sum by (instance) (db_role_check_failures_total) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Startup database role check found problems or could not run"
          action: "Read the startup log for the role report; kind=inspect_error means the check could not query the role (db_runtime_role_problems may stay 0)."

      # One failed retention run is worth a look (tables keep growing, nothing is lost). Blind spot: when retention
      # is disabled (default) nothing runs and nothing fails; there is no 'retention last success' metric.
      - alert: SecurityEventRetentionFailing
        expr: sum by (instance) (increase(security_event_retention_errors_total[1h])) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "security_events retention job failed"
          action: "Inspect DB privileges and the app_purge_security_events function; see the janitor error log line."

      # A lost audit record is a compliance event; the redacted event is in the error log.
      - alert: SecurityEventPersistFailing
        expr: sum by (instance) (increase(security_event_persist_failures_total[5m])) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Security events could not be persisted"
          action: "Recover events from the log line 'security-events: FAILED TO PERSIST' and fix the database write path."

      # The janitor ticks every 10 minutes: 3 cleanup failures in 30 minutes is three consecutive failed ticks.
      # The retention task is excluded (own rule) so one bad tick is not counted twice.
      - alert: SecurityJanitorFailing
        expr: sum by (instance) (increase(security_janitor_failures_total{task="cleanup"}[30m])) > 2
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Security janitor cleanup keeps failing"
          action: "Sessions, throttle rows, stream tokens and rate-limit buckets are not being cleaned; check the cleanup failed log line."

      # Last success, or process start when there has been none yet (the gauge is 0 until the first success), so a
      # process that never succeeds still fires after one hour of uptime. Six missed ticks.
      - alert: SecurityJanitorStale
        expr: time() - (security_janitor_last_success_timestamp_seconds > 0 or process_start_time_seconds) > 3600
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Security janitor has not completed a cleanup in over an hour"
          action: "Is the janitor running on this instance? Look for hung database connections."

      # Credential-stuffing signal: 30 throttled logins in 10 minutes (a single user rarely exceeds 5).
      - alert: LoginThrottleSpike
        expr: sum by (instance) (increase(auth_throttle_denied_total{kind="login"}[10m])) > 30
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Many throttled login attempts"
          action: "Review auth.login.throttled security events by scope; consider blocking the source at the edge."

      # MFA throttling means the password step already succeeded, so the threshold is lower than for logins.
      - alert: MfaThrottleSpike
        expr: sum by (instance) (increase(auth_throttle_denied_total{kind="mfa"}[10m])) > 10
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Many throttled MFA attempts"
          action: "A password is likely known to an attacker. Review auth.mfa.throttled events; force resets for affected accounts."

      # Without this a dead or unscrapable instance silently disables every rule above. Also covers production
      # refusing to boot on an unsafe database role.
      - alert: MetricsTargetDown
        expr: up{job="voice-agent-api"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "An API instance cannot be scraped (metrics and every other alert are blind)"
          action: "Instance down, METRICS_TOKEN mismatch (401), scrape hostname missing from API_PRIVATE_HOSTS (404) or network path broken."

      # Restarts reset every counter; this makes that blind spot visible.
      - alert: ApiRestartLoop
        expr: changes(process_start_time_seconds{job="voice-agent-api"}[30m]) > 2
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "API process restarted more than twice in 30 minutes"
          action: "Crash loop or repeated deploys. Increments just before a crash can be invisible."

  - name: voice-agent-meta
    rules:
      # Always firing. Proves rule evaluation -> Alertmanager -> receiver works (a dead-man's switch: alert on its
      # ABSENCE at the receiving side). Route it to a heartbeat receiver, never to a pager.
      - alert: Watchdog
        expr: vector(1)
        for: 0m
        labels: { severity: none }
        annotations:
          summary: "Watchdog: the alerting pipeline is evaluating rules (always firing by design)"
          action: "None. Act if this alert STOPS arriving at the heartbeat receiver."
